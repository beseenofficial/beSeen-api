services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    ports:
      - '127.0.0.1:27017:27017'
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --eval "try { if (db.hello().isWritablePrimary) { quit(0) }; rs.status(); quit(2) } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(2) }"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s

  api:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_URI: mongodb://mongo:27017/?replicaSet=rs0
      DB_NAME: ${DB_NAME:-beseen}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-beseen.fi}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET must be 222222222set}
      BLUX_BASE_URL: ${BLUX_BASE_URL:-https://api.blux.cc}
      BLUX_APP_ID: ${BLUX_APP_ID:?BLUX_APP_ID must be set}
      BLUX_APP_SECRET: ${BLUX_APP_SECRET:?BLUX_APP_SECRET must be set}
      BLUX_VERIFICATION_TIMEOUT_MS: ${BLUX_VERIFICATION_TIMEOUT_MS:-5000}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT must be set}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID must be set}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY must be set}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-beseen-avatars}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?R2_PUBLIC_BASE_URL must be set}
      R2_MAX_AVATAR_BYTES: ${R2_MAX_AVATAR_BYTES:-5242880}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      BROADCAST_DRAFT_TTL_SECONDS: ${BROADCAST_DRAFT_TTL_SECONDS:-604800}
      BROADCAST_CLEANUP_INTERVAL_SECONDS: ${BROADCAST_CLEANUP_INTERVAL_SECONDS:-300}
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/v1/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  mongo-data:
  mongo-config:

networks:
  backend:
    driver: bridge
