services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-beseen}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-beseen_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
      MONGO_REPLICA_SET_KEY: ${MONGO_REPLICA_SET_KEY:?MONGO_REPLICA_SET_KEY must be set}
    entrypoint:
      - /bin/bash
      - -c
      - |
        umask 077
        printf '%s' "$$MONGO_REPLICA_SET_KEY" > /tmp/mongodb-keyfile
        chown mongodb:mongodb /tmp/mongodb-keyfile
        exec /usr/local/bin/docker-entrypoint.sh mongod \
          --replSet rs0 \
          --keyFile /tmp/mongodb-keyfile \
          --bind_ip_all
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "try { if (db.hello().isWritablePrimary) { quit(0) }; rs.status(); quit(2) } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(2) }"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s

  mongo-init:
    image: mongo:8.0
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-beseen}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-beseen_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-beseen_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD must be set}
    entrypoint:
      - /bin/bash
      - -ec
      - |
        mongosh --quiet --host mongo \
          --username "$$MONGO_INITDB_ROOT_USERNAME" \
          --password "$$MONGO_INITDB_ROOT_PASSWORD" \
          --authenticationDatabase admin \
          --eval '
            const databaseName = process.env.MONGO_INITDB_DATABASE;
            const username = process.env.MONGO_APP_USERNAME;
            const password = process.env.MONGO_APP_PASSWORD;
            const applicationDatabase = db.getSiblingDB(databaseName);
            const roles = [{ role: "readWrite", db: databaseName }];
            if (applicationDatabase.getUser(username)) {
              applicationDatabase.updateUser(username, { pwd: password, roles });
            } else {
              applicationDatabase.createUser({ user: username, pwd: password, roles });
            }
          '
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: beseen-api:local
    restart: unless-stopped
    init: true
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_URI: mongodb://${MONGO_APP_USERNAME:-beseen_app}:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD must be set}@mongo:27017/?replicaSet=rs0&authSource=${DB_NAME:-beseen}
      DB_NAME: ${DB_NAME:-beseen}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-public}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-beseen.app}
      AUTH_CHALLENGE_TTL_SECONDS: ${AUTH_CHALLENGE_TTL_SECONDS:-300}
      REGISTRATION_TOKEN_TTL_SECONDS: ${REGISTRATION_TOKEN_TTL_SECONDS:-600}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET must be set}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      BROADCAST_DRAFT_TTL_SECONDS: ${BROADCAST_DRAFT_TTL_SECONDS:-604800}
      BROADCAST_CLEANUP_INTERVAL_SECONDS: ${BROADCAST_CLEANUP_INTERVAL_SECONDS:-300}
    ports:
      - '127.0.0.1:5000:5000'
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5000/v1/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  mongo-data:
  mongo-config:

networks:
  backend:
    driver: bridge
